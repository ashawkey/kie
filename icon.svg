<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="kie">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ac8fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6f5"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-8 32 32)">
    <!-- board -->
    <rect x="6" y="11" width="52" height="42" rx="6" fill="url(#body)"/>
    <!-- one sweeping brush stroke -->
    <path d="M16 44Q32 41 46 18" fill="none" stroke="url(#ink)" stroke-width="5.5" stroke-linecap="round"/>
    <!-- pixels: a pair at the near corner, one echoing opposite -->
    <rect x="10.5" y="15.5" width="6.5" height="6.5" rx="1.5" fill="#5ac8fa"/>
    <rect x="10.5" y="25.5" width="4.5" height="4.5" rx="1.2" fill="#5ac8fa" opacity=".55"/>
    <rect x="47" y="44" width="4.5" height="4.5" rx="1.2" fill="#a78bfa" opacity=".8"/>
  </g>
</svg>
