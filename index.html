<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>kie — Liquid Glass Image Editor</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="css/glass.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="backdrop"></div>

<div id="app">
  <!-- top bar -->
  <header id="topbar" class="glass">
    <div class="brand">
      <img class="mark" src="icon.svg" alt="" width="24" height="24">
      <span class="name">kie</span>
    </div>
    <span id="doc-title" class="doc-title">untitled</span>
    <div class="gdivider"></div>
    <nav id="menubar" style="display:flex;gap:2px"></nav>
    <div class="spacer"></div>
    <button id="btn-undo" class="gbtn icon-only" data-tip="Undo" data-tip-desc="Step backwards through your edit history." data-tip-side="below" aria-label="Undo">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h11a5 5 0 010 10h-5"/><path d="M8 5L4 9l4 4"/></svg></span>
    </button>
    <button id="btn-redo" class="gbtn icon-only" data-tip="Redo" data-tip-desc="Reapply the edit you just undid." data-tip-side="below" aria-label="Redo">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 9H9a5 5 0 000 10h5"/><path d="M16 5l4 4-4 4"/></svg></span>
    </button>
    <div class="gdivider"></div>

    <!-- zoom cluster -->
    <div id="zoomgroup">
      <button id="zoom-out" class="gbtn icon-only" data-tip="Zoom out" data-tip-desc="Show more of the canvas." data-tip-side="below" aria-label="Zoom out">−</button>
      <button id="zoom-value" class="gbtn zval" data-tip="Zoom level" data-tip-desc="Click to return to 100%, actual pixel size." data-tip-side="below">100%</button>
      <button id="zoom-in" class="gbtn icon-only" data-tip="Zoom in" data-tip-desc="Magnify the canvas for pixel-level work." data-tip-side="below" aria-label="Zoom in">+</button>
      <button id="btn-fit" class="gbtn icon-only" data-tip="Fit on screen" data-tip-desc="Scale the view so the whole image is visible." data-tip-side="below" aria-label="Fit on screen">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 011-1h4M15 4h4a1 1 0 011 1v4M20 15v4a1 1 0 01-1 1h-4M9 20H5a1 1 0 01-1-1v-4"/></svg></span>
      </button>
    </div>

    <div class="gdivider"></div>
    <button id="btn-lang" class="gbtn lang-btn" data-tip="Language" data-tip-desc="Switch the interface between English and Chinese." data-tip-side="below" aria-label="Language">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.7"/><path d="M3.4 12h17.2"/><path d="M12 3.3a14 14 0 010 17.4a14 14 0 010-17.4"/></svg></span>
      <span id="lang-label">EN</span>
    </button>
    <button id="btn-help" class="gbtn icon-only" data-tip="Help" data-tip-desc="Open the guide to every tool and keyboard shortcut." data-tip-side="below" aria-label="Help">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.7"/><path d="M9.6 9.4a2.5 2.5 0 114.2 2.2c-.9.7-1.8 1.1-1.8 2.3"/><circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/></svg></span>
    </button>
    <button id="btn-export" class="gbtn primary" data-tip="Export" data-tip-desc="Choose a format, scale and quality, then save the image." data-tip-side="below">Export</button>
  </header>

  <!-- tool options -->
  <div id="optionsbar" class="glass gscroll"></div>

  <!-- main workspace -->
  <div id="main">
    <aside id="toolrail" class="glass gscroll"></aside>

    <section id="stage">
      <canvas id="viewcanvas"></canvas>

      <!-- navigator: full downsampled document + current viewport -->
      <div id="navigator" class="glass">
        <button id="nav-toggle" class="nav-head" aria-expanded="true" aria-controls="nav-body" data-tip="Navigator" data-tip-desc="Overview of the whole image. Click or drag to jump around; click here to collapse." data-tip-side="above">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 15l4.5-4 3.5 3 4-5 5 6"/><circle cx="9" cy="9" r="1.4"/></svg></span>
          <span id="nav-title" class="nav-title">Navigator</span>
          <span class="icon chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></span>
        </button>
        <div id="nav-body" class="nav-body">
          <div id="nav-view" class="nav-view checker">
            <canvas id="nav-canvas"></canvas>
            <div id="nav-rect" class="nav-rect"></div>
          </div>
        </div>
      </div>
    </section>

    <aside id="dock"></aside>
  </div>

  <!-- status -->
  <footer id="statusbar" class="glass">
    <span class="mono" id="status-pos">—</span>
    <div class="gdivider"></div>
    <span class="mono" id="status-size">—</span>
    <div class="gdivider"></div>
    <span class="mono" id="status-sel">no selection</span>
    <div class="gdivider"></div>
    <span class="hint" id="status-hint"></span>
  </footer>
</div>

<div id="modal-layer"></div>
<div id="toasts"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
